name: Build Ascension

# This workflow builds the actual installable mod jar on GitHub's hosted
# runners, which (unlike the environment this project was authored in)
# have real internet access to Maven Central, Fabric's Maven, and
# Mojang's libraries server. Push this repo to GitHub, and either:
#   - open the "Actions" tab and re-run this workflow manually, or
#   - just push to main/master — it runs automatically (see `on:` below)
# then download the "ascension-jar" artifact from the finished run.
# That artifact IS build/libs/ascension-1.0.0.jar — a real Gradle/Fabric
# Loom build output, not anything hand-assembled.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Gradle wrapper (if not already committed)
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.12
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: List build output (for the workflow log)
        run: ls -la build/libs/

      - name: Upload the installable mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ascension-jar
          path: build/libs/ascension-*.jar
          if-no-files-found: error

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build/reports/
            **/*.log

