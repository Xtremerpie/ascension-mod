plugins {
	id 'fabric-loom' version '1.14-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories here if you need to depend on other mods.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
}

loom {
	// Split source sets are not used here; a single source set keeps this
	// project simple to open in any IDE without extra Loom configuration.
}

dependencies {
	// ASCENSION's current Java source uses Fabric/Yarn names (for example
	// MinecraftClient, KeyBinding, InputUtil and PersistentProjectileEntity).
	// Keep the source and mappings namespace consistent.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API — required here for keybindings, HUD render callbacks,
	// tick events, networking and other client/server hooks.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}
